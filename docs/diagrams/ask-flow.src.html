<!doctype html>
<html lang="ko" data-register="editorial"><head><title>질문하면, 근거를 찾아 답합니다</title><link rel="stylesheet" href="kit.css" data-ve-kit><style>
:root { color-scheme:light; --bg:#fff; --text:#292f3e; --text-dim:#56647a; --accent:#2866c2; }
body { margin:0; background:#fff; color:#292f3e; font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
main { max-width:1000px; padding:36px; margin:auto; }
figure { margin:0; }
main h1 { word-break:keep-all; max-width:none; width:auto; font-family:inherit; font-size:32px; font-weight:700; line-height:1.4; letter-spacing:-.6px; margin:0 0 32px; }
.flow { display:grid; grid-template-columns:1fr 40px 1fr 40px 1fr; align-items:stretch; }
.stage { min-width:0; padding:24px 20px; border:1px solid #c7d4e6; border-radius:12px; }
.stage:first-child { background:#edf4ff; border-color:#2866c2; }
.who { font-size:18px; color:#2866c2; margin:0 0 12px; font-weight:600; }
main h2 { max-width:none; font-family:inherit; font-size:26px; line-height:1.45; letter-spacing:-.4px; margin:0 0 22px; word-break:keep-all; }
.stage p { line-height:1.65; word-break:keep-all; }
.detail { font-size:19px; margin:0; }
.command { display:block; margin-top:28px; font-size:16px; color:#56647a; font-family:ui-monospace,monospace; }
.arrow { display:flex; align-items:center; justify-content:center; color:#2866c2; font-size:28px; }
figcaption { font-size:19px; line-height:1.7; margin:24px 0 0; color:#56647a; word-break:keep-all; }
@media(max-width:650px) { main { padding:24px; } main h1 { font-size:27px; } .flow { grid-template-columns:1fr; } .arrow { height:40px; transform:rotate(90deg); } h2 { margin-bottom:12px; } .command { margin-top:16px; } }

.steps {display:grid;gap:16px;} .step {display:grid;grid-template-columns:1fr;gap:16px;padding:24px;border:1px solid #c7d4e6;border-radius:12px;} .step:last-child {background:#edf4ff;border-color:#2866c2;} main .step h2 {font-size:24px;margin:0;} .step p {font-size:20px;line-height:1.65;margin:0;word-break:keep-all;} .step small {display:block;color:#56647a;font-size:18px;margin-top:8px;} @media(max-width:650px){.step{grid-template-columns:1fr;gap:12px;padding:20px;} main .step h2 {font-size:23px;} .step p{font-size:19px;}}</style></head><body><main><figure><h1>질문하면, 근거를 찾아 답합니다</h1><div class="steps"><div class="step"><h2>1. 관련 지식 찾기</h2><div class="explanation"><p>질문과 앞선 대화에서 주제를 파악합니다.<small>목차·동의어로 자료를 좁히고, 부족하면 검색 범위를 넓힙니다.</small></p></div></div><div class="step"><h2>2. 근거 확인하기</h2><div class="explanation"><p>충분하고 최신인 근거는 다시 활용합니다.<small>관련 자료의 변경을 먼저 확인하고, 바뀐 지식만 갱신합니다. 현재 상태는 직접 조회합니다.</small></p></div></div><div class="step"><h2>3. 출처와 답하기</h2><div class="explanation"><p>핵심 답변과 설명에 원본 출처를 붙입니다.<small>확인한 사실·추론·미확인 부분을 구분합니다.</small></p></div></div></div><figcaption>원본에 접근하지 못했다면, 최신 확인을 마쳤다고 말하지 않습니다.</figcaption></figure></main></body></html>
