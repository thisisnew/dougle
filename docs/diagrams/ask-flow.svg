<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ask-flow-title ask-flow-desc" id="ask-flow-root"><title id="ask-flow-title">더글의 질문과 근거 확인</title><desc id="ask-flow-desc">질문에 관련된 기억과 출처를 찾고 근거와 최신성을 판단해 필요한 원본을 확인한 뒤 출처 있는 답변을 제공합니다.</desc><defs>
      <style>#ask-flow-root { color: #292f3e; font-family: 'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
      #ask-flow-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#ask-flow-root .diagram-container { overflow-x:visible }
}</style><marker id="ask-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#637087"/></marker></defs><rect width="960" height="648" fill="#ffffff"/><text x="40" y="48" fill="#292f3e" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="28" font-weight="600" text-anchor="start">질문하면, 근거를 찾아 답합니다</text><text x="40" y="80" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="14" font-weight="400" text-anchor="start">기억을 재사용하되, 최신성이나 근거가 부족하면 원본을 확인합니다.</text><path d="M256 156 V188" fill="none" stroke="#637087" stroke-width="1.5" marker-end="url(#ask-flow-arrow)"/><path d="M256 268 V300" fill="none" stroke="#637087" stroke-width="1.5" marker-end="url(#ask-flow-arrow)"/><path d="M376 360 H568" fill="none" stroke="#637087" stroke-width="1.5" marker-end="url(#ask-flow-arrow)"/><path d="M256 420 V484" fill="none" stroke="#637087" stroke-width="1.5" marker-end="url(#ask-flow-arrow)"/><path d="M708 404 V524 Q708 532 700 532 H432" fill="none" stroke="#637087" stroke-width="1.5" marker-end="url(#ask-flow-arrow)"/><rect x="416.0" y="328" width="88" height="24" fill="#ffffff"/><text x="460" y="344" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle">확인 필요</text><rect x="268.0" y="444" width="96" height="24" fill="#ffffff"/><text x="316" y="460" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="middle">재사용 가능</text><g><rect x="136" y="112" width="240" height="44" rx="20" fill="#ffffff" stroke="#637087" stroke-width="1.5"/><text x="152" y="144" fill="#292f3e" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">업무 질문</text></g><g><rect x="136" y="188" width="240" height="80" rx="6" fill="#ffffff" stroke="#637087" stroke-width="1.5"/><text x="152" y="220" fill="#292f3e" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">관련 지식과 출처 찾기</text><text x="152" y="244" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">주제 · 동의어 · 대화 맥락</text></g><path d="M256 300 L376 360 L256 420 L136 360 Z" fill="#edf4ff" stroke="#2866c2" stroke-width="1.5"/><text x="256" y="356" fill="#2866c2" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="middle">근거가 충분하고</text><text x="256" y="380" fill="#2866c2" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="14" font-weight="600" text-anchor="middle">확인 기한 안인가?</text><g><rect x="568" y="300" width="280" height="104" rx="6" fill="#ffffff" stroke="#637087" stroke-width="1.5"/><text x="584" y="332" fill="#292f3e" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">관련 원본 확인</text><text x="584" y="356" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">기본 1시간 경과 · 변경 · 충돌</text><text x="584" y="380" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">현재 DB 상태·최신 설정은 매번</text></g><g><rect x="80" y="484" width="352" height="96" rx="20" fill="#edf4ff" stroke="#2866c2" stroke-width="1.5"/><text x="96" y="516" fill="#2866c2" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">설명과 원본 출처로 답변</text><text x="96" y="540" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">확인한 사실 · 추론 · 미확인을 구분</text></g><text x="40" y="620" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">검색 범위가 부족하면 확대합니다. 접근 실패를 ‘자료 없음’이나 ‘최신 확인 완료’로 표시하지 않습니다.</text></svg>
