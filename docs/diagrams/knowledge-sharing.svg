algun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">팀 GitHub 저장소</text><text x="704" y="208" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">선택한 정제 지식을 공유</text><text x="704" y="232" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">원본 전체를 올리는 것이 아님</text></g><g><rect x="320" y="320" width="272" height="112" rx="6" fill="#edf4ff" stroke="#2866c2" stroke-width="1.5"/><text x="336" y="344" fill="#56647a" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start">04 / MERGE</text><text x="336" y="372" fill="#2866c2" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">동료의 기존 지식 + 공유 지식</text><text x="336" y="400" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">출처·정정·충돌을 보존해 병합</text></g><g><rect x="40" y="320" width="192" height="112" rx="6" fill="#ffffff" stroke="#637087" stroke-width="1.5"/><text x="56" y="344" fill="#56647a" font-family="'Geist Mono',ui-monospace,monospace" font-size="12" font-weight="400" text-anchor="start">05 / USE</text><text x="56" y="372" fill="#292f3e" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="16" font-weight="600" text-anchor="start">동료의 AI 답변</text><text x="56" y="400" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">가져온 지식도 질문에 활용</text></g><text x="40" y="476" fill="#56647a" font-family="'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif" font-size="12" font-weight="400" text-anchor="start">CONNECT: 자료 연결     PUBLISH: 지식 