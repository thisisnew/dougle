<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="knowledge-sharing-title knowledge-sharing-desc" id="knowledge-sharing-root"><title id="knowledge-sharing-title">더글의 지식 내재화와 팀 공유</title><desc id="knowledge-sharing-desc">자료를 연결해 내 지식으로 정리하고 선택한 지식을 팀 저장소에 게시하면 동료가 가져와 기존 지식과 합쳐 질문에 활용합니다.</desc><defs>
      <style>#knowledge-sharing-root { color: #292f3e; font-family: 'Geist','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; }
