[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dougle-bot"
version = "0.1.24"
description = "Local Slack reply and developer handoff runtime for Dougle skills"
requires-python = ">=3.12"
dependencies = ["slack-bolt==1.30.0"]

[project.scripts]
dougle-bot = "dougle_bot.main:cli"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
