name: Verify skills and optional bot
on:
  push:
    paths: ['README.md', 'AGENTS.md', 'HANDOFF.md', 'docs/**', 'skills/**', 'plugins/dougle/**', 'dougle-bot/**', 'scripts/check-skills.mjs', 'scripts/check-sharing-merge.mjs', 'scripts/check-current-tree.mjs', 'scripts/check-large-package.mjs', 'scripts/test-publish-sensitive.mjs', 'scripts/benchmark-publish-sensitive.py', '.github/workflows/verify-skills-and-bot.yml']
  pull_request:
    paths: ['README.md', 'AGENTS.md', 'HANDOFF.md', 'docs/**', 'skills/**', 'plugins/dougle/**', 'dougle-bot/**', 'scripts/check-skills.mjs', 'scripts/check-sharing-merge.mjs', 'scripts/check-current-tree.mjs', 'scripts/check-large-package.mjs', 'scripts/test-publish-sensitive.mjs', 'scripts/benchmark-publish-sensitive.py', '.github/workflows/verify-skills-and-bot.yml']
permissions:
  contents: read
jobs:
  fake-integrations:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install ./dougle-bot pytest==9.2.0 ruff==0.17.4
      - run: node scripts/check-skills.mjs
      - run: node scripts/check-sharing-merge.mjs
      - run: node scripts/check-current-tree.mjs
      - run: node scripts/check-large-package.mjs
      - run: node scripts/test-publish-sensitive.mjs
      - run: ruff check dougle-bot
      - run: ruff check scripts/benchmark-publish-sensitive.py
      - run: python scripts/benchmark-publish-sensitive.py --counts 3 --output /tmp/dougle-scanner-smoke.json
      - run: pytest -q dougle-bot/tests
